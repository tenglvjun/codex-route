name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x86_64
          - os: windows-11-arm
            platform: windows
            arch: arm64
          - os: macos-14
            platform: macos
            arch: universal
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Verify release version
        shell: bash
        run: |
          node - <<'NODE'
          const { readFileSync } = require("node:fs");
          const config = JSON.parse(readFileSync("src-tauri/tauri.conf.json", "utf8"));
          const tagVersion = process.env.GITHUB_REF_NAME.replace(/^v/, "");
          if (config.version !== tagVersion) {
            throw new Error(`Release tag ${tagVersion} does not match Tauri version ${config.version}`);
          }
          NODE

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Windows ARM64 target
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: rustup target add aarch64-pc-windows-msvc

      - name: Add macOS targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            curl \
            file \
            patchelf \
            rpm \
            libssl-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows app
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ matrix.arch }}' -eq 'arm64') {
            pnpm tauri build --target aarch64-pc-windows-msvc --bundles msi
          } else {
            pnpm tauri build --bundles msi
          }

      - name: Build macOS universal app
        if: matrix.platform == 'macos'
        run: pnpm tauri build --target universal-apple-darwin

      - name: Remove application icon from macOS DMG volume
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="src-tauri/target/universal-apple-darwin/release/bundle"
          dmg_path=$(find "$bundle_root/dmg" -maxdepth 1 -name '*.dmg' -type f | head -n 1 || true)
          test -n "$dmg_path" || { echo "No macOS DMG found" >&2; exit 1; }
          ./scripts/patch-dmg-volume-icon.sh "$dmg_path"
          ./scripts/check-dmg-volume-icon.sh "$dmg_path"

      - name: Build Linux packages
        if: matrix.platform == 'linux'
        run: pnpm tauri build --bundles appimage,deb,rpm

      - name: Prepare Windows release assets
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME
          $isArm64 = $env:RELEASE_ARCH -eq 'arm64'
          $targetRoot = if ($isArm64) {
            'src-tauri/target/aarch64-pc-windows-msvc/release'
          } else {
            'src-tauri/target/release'
          }
          $suffix = if ($isArm64) { '-arm64' } else { '' }
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle/msi') -Filter '*.msi' -Recurse |
            Select-Object -First 1
          if ($null -eq $msi) {
            throw "No Windows MSI found under $targetRoot"
          }
          Copy-Item $msi.FullName "release-assets/Codex-Route-$version-Windows$suffix.msi"

      - name: Prepare macOS release assets
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          bundle_root="src-tauri/target/universal-apple-darwin/release/bundle"
          app_path=$(find "$bundle_root/macos" -maxdepth 1 -name '*.app' -type d | head -n 1 || true)
          dmg_path=$(find "$bundle_root/dmg" -maxdepth 1 -name '*.dmg' -type f | head -n 1 || true)
          test -n "$app_path" || { echo "No macOS .app found" >&2; exit 1; }
          test -n "$dmg_path" || { echo "No macOS .dmg found" >&2; exit 1; }
          mkdir -p release-assets
          cp "$dmg_path" "release-assets/Codex-Route-${version}-macOS.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" \
            "release-assets/Codex-Route-${version}-macOS.zip"

      - name: Prepare Linux release assets
        if: matrix.platform == 'linux'
        shell: bash
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          bundle_dir="src-tauri/target/release/bundle"
          mkdir -p release-assets
          for extension in AppImage deb rpm; do
            artifact=$(find "$bundle_dir" -type f -iname "*.$extension" | head -n 1 || true)
            test -n "$artifact" || { echo "No .$extension artifact found" >&2; exit 1; }
            cp "$artifact" "release-assets/Codex-Route-${version}-Linux-${RELEASE_ARCH}.${extension}"
          done

      - name: Upload platform assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download platform assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Codex Route ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

[package]
name = "codex-route"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A local utility for resolving Codex session IDs to workspaces"
readme = "README.md"

[dependencies]
axum = "0.7"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
thiserror = "2"
toml = "0.8"
walkdir = "2"
zstd = "0.13"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[package]
name = "codex-route"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A local utility for resolving Codex session IDs to workspaces"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
walkdir = "2"
zstd = "0.13"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
